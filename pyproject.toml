[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenant-video-room-service"
version = "0.1.0"
description = "A small FastAPI service for tenant-scoped video rooms and member tokens."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/tenant_video"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
